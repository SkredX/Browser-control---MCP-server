[project]
name = "browser-control-mcp-server"
version = "0.1.0"
description = "A Playwright-powered MCP server for browser automation and content extraction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
    "mcp>=1.0.0",
    "playwright>=1.48.0",
    "playwright-stealth>=1.0.6",
    "pydantic>=2.0.0",
]

[project.scripts]
browser-control-mcp = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
